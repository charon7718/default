<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>安全验证</title>
    <style>
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background-color: #000;
        color: #fff;
        margin: 0;
        font-family: Arial, sans-serif;
        flex-direction: column;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        background-image: linear-gradient(#000, transparent);
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      /* ===== 主内容（初始隐藏） ===== */
      #main-content {
        display: none; /* 验证通过前隐藏 */
      }

      h1 {
        margin-bottom: 0.5rem;
        font-size: 3rem;
        font-weight: bold;
        line-height: 1.33333;
      }

      .text {
        font-size: 1.5rem;
        line-height: 1.33333;
      }

      .lds-ellipsis {
        display: inline-block;
        position: relative;
        width: 40px;
        height: 10px;
      }

      .lds-ellipsis div {
        position: absolute;
        top: 2px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation-timing-function: cubic-bezier(0, 1, 1, 0);
      }

      .lds-ellipsis div:nth-child(1) { left: 6px; animation: lds-ellipsis1 0.6s infinite; }
      .lds-ellipsis div:nth-child(2) { left: 6px; animation: lds-ellipsis2 0.6s infinite; }
      .lds-ellipsis div:nth-child(3) { left: 17px; animation: lds-ellipsis2 0.6s infinite; }
      .lds-ellipsis div:nth-child(4) { left: 28px; animation: lds-ellipsis3 0.6s infinite; }

      @keyframes lds-ellipsis1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
      @keyframes lds-ellipsis2 { 0% { transform: translate(0, 0); } 100% { transform: translate(10px, 0); } }
      @keyframes lds-ellipsis3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }

      #backup-btn {
        margin-top: 2rem;
        padding: 10px 20px;
        background-color: transparent;
        border: 2px solid #fff;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s;
      }

      #backup-btn:hover {
        background-color: #fff;
        color: #000;
      }

      /* ===== CAP 验证容器 ===== */
      #captcha-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .captcha-title {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .captcha-tip {
        margin-top: 1rem;
        font-size: 0.95rem;
        color: #aaa;
      }

      cap-widget {
        /* 页面是黑色背景，CAP 改成浅色卡片以增强对比 */
        --cap-background: #ffffff;
        --cap-border-color: #d9d9d9;
        --cap-text-color: #111111;
        --cap-checkbox-background: #f3f3f3;
        --cap-checkbox-border: #999999;
        --cap-checkbox-checked-background: #22c55e;
      }

      @media (max-width: 768px) {
        html { font-size: 12px; }
      }
    </style>
  </head>
  <body>

    <!-- ===== CAP 验证拦截层 ===== -->
    <div id="captcha-container">
      <div class="captcha-title">请完成安全验证</div>
      <cap-widget
        id="capWidget"
        data-cap-api-endpoint="https://cap.lei-su.com/f674463fae/"
      ></cap-widget>
      <div class="captcha-tip" id="captchaTip">完成验证后将自动选择最优线路</div>
    </div>

    <!-- ===== 原本的主内容 ===== -->
    <div id="main-content">
      <h1>安全检查</h1>
      <div class="text" id="info">
        正在为您选择最优线路
        <div class="lds-ellipsis">
          <div></div><div></div><div></div><div></div>
        </div>
      </div>

      <button id="backup-btn" onclick="goBackup()">手动进入备用网址</button>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/cap-widget"></script>

    <script type="text/javascript">
      // ===== 基础配置 =====
      const backupUrl = "https://154.44.20.58:5412/";
      const jumpDelay = 3000; // 人为延迟跳转时间，单位毫秒（3000 = 3秒）

      function goBackup() {
        const suffix = window.location.pathname + window.location.search + window.location.hash;
        window.location.href = backupUrl.replace(/\/+$/, "") + suffix;
      }

      // ===== 节点配置 =====
      const nodes = [
        { jumpUrl: "https://apple.airport-ls.top/", testImg: "https://apple.airport-ls.top/images/favicon.ico" },
        { jumpUrl: "https://china.airport-ls.top/", testImg: "https://china.airport-ls.top/images/favicon.ico" },
        { jumpUrl: "https://leisu-next.netlify.app/", testImg: "https://leisu-next.netlify.app/images/favicon.ico" },
        { jumpUrl: "https://leisu-next.pages.dev/", testImg: "https://leisu-next.pages.dev/images/favicon.ico" }
      ];

      let jumped = false;
      const timeout = 30000; 

      function testNode(node) {
        if (jumped) return;
        const img = new Image();
        img.src = node.testImg + "?t=" + Date.now();
        
        img.onload = function () {
          if (!jumped) {
            jumped = true; // 锁定状态，防止多个节点重复触发
            
            // 找到最快节点后，延迟执行跳转
            setTimeout(() => {
              const suffix = window.location.pathname + window.location.search + window.location.hash;
              const target = node.jumpUrl.replace(/\/+$/, "") + suffix;
              window.location.href = target;
            }, jumpDelay);
          }
        };
      }

      // 开始进行节点测速和展现页面
      function startCheck() {
        // 1. 隐藏验证码，显示测速主页面
        document.getElementById("captcha-container").style.display = "none";
        document.getElementById("main-content").style.display = "block";

        // 2. 执行原有的测速逻辑
        nodes.forEach(testNode);

        setTimeout(() => {
          if (!jumped) {
            document.getElementById("info").innerHTML = '线路异常，请反馈至左下角在线客服';
          }
        }, timeout);
      }
    </script>

    <!-- ===== CAP 验证交互脚本 ===== -->
    <script type="text/javascript">
      window.addEventListener('DOMContentLoaded', function () {
        const widget = document.getElementById('capWidget');
        const tip = document.getElementById('captchaTip');

        widget.addEventListener('solve', function (e) {
          tip.innerText = '验证通过，正在选择最优线路…';
          // e.detail.token 为 CAP 返回的验证 token。
          // 当前页面仅用于前端拦截；如需真正防机器人，
          // 应将 token 发送到你的服务端并调用 CAP /siteverify 校验。
          setTimeout(startCheck, 300);
        });

        widget.addEventListener('error', function (e) {
          tip.innerText = '验证加载失败，请刷新页面后重试';
          console.error('CAP error:', e.detail);
        });
      });
    </script>

    <!-- ===== 客服系统保持不变 ===== -->
    <script>
  window.chatwootSettings = {"position":"right","type":"standard","launcherTitle":""};
  (function(d,t) {
    var BASE_URL="https://chat.lei-su.com";
    var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
    g.src=BASE_URL+"/packs/js/sdk.js";
    g.async = true;
    s.parentNode.insertBefore(g,s);
    g.onload=function(){
      window.chatwootSDK.run({
        websiteToken: '85RpEMJiaD4syZPr3fMEZrHb',
        baseUrl: BASE_URL
      })
    }
  })(document,"script");
</script>

  </body>
</html>
